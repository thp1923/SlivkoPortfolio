<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slivko MBTI</title>
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts for Y2K aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Princess+Sofia&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Times+New+Roman&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <!-- Dithered overlay for Y2K effect -->
    <div class="dither-overlay" aria-hidden="true"></div>

    <!-- Container for the three-column layout -->
    <div class="container">
        <!-- Header -->
        <header class="site-header">
            <h1 class="masthead">Slivko</h1>
            <nav class="navbar" aria-label="Primary navigation">
                <a href="#social">Social</a>
                <a href="#comments">Comments</a>
            </nav>
        </header>

        <!-- Main Content Area - Three Column Layout -->
        <main class="main-content">
            <!-- Left Navigation & Link Sidebar -->
            <aside class="left-sidebar">
                <div class="floating-image">
                    <img src="Images/1.png" alt="Flying image" class="fly-img">
                </div>
            </aside>

            <!-- Central Content Feed -->
            <section class="central-content">
                <!-- Welcome Title -->
                <h1 class="page-title">Welcome to My MBTI Profile</h1>

                <div class="royal-decree">
                    <img src="Images/55a3c60f-b77d-40d2-b17e-1ca120eed5e7.jpg" alt="???img" class="about-img">
                </div>
                <section id="comments" class="comments-section" aria-labelledby="comments-title">
                    <div class="comments-heading">
                        <h2 id="comments-title" class="section-header">Lời nhắn</h2>
                        <p id="comments-status" class="comments-status" aria-live="polite">Đang tải lời nhắn...</p>
                    </div>
                    <div id="comments-list" class="comments-list" aria-busy="true"></div>
                </section>

                <!-- Social Section -->
                <section id="social">
                    <h2 class="section-header">Social</h2>
                    <div class="social-links">
                        <a href="#" class="social-link" title="Discord">
                            <i class="fab fa-discord"></i>
                        </a>
                        <a href="#" class="social-link" title="TikTok">
                            <i class="fab fa-tiktok"></i>
                        </a>
                        <a href="#" class="social-link" title="YouTube">
                            <i class="fab fa-youtube"></i>
                        </a>
                    </div>
                </section>
            </section>

            <!-- Right Sidebar for Personal Bios and Media Widgets -->
            <aside class="right-sidebar">
                <!-- Floating image on right -->
                <div class="floating-image-right">
                    <img src="Images/2.png" alt="Floating image" class="fly-img-right">
                </div>
                <!-- Mascot with 3D effect -->
                <div class="mascot-container">
                    <div class="mascot-3d">
                        <!-- Replace with your mascot image -->
                        <img src="Images/SlivkoMascot.png" alt="Mascot" class="mascot-img">
                    </div>
                </div>

                <!-- Moved from left sidebar -->
                <div class="sidebar-widget">
                    <h3 class="sidebar-title">⸸ Slivko Ad 🜏</h3>
                    <p class="sidebar-text">• INTP • 8w7 • 854 • SX/SP</p>
                </div>

                <div class="sidebar-widget">
                    <h3 class="sidebar-title">More</h3>
                    <div class="media-widget">
                        <p>ILE-C</p>
                        <p>R/[S]cUeI</p>
                        <p>AOxwv[E]x</p>
                        <p>IT(N) Chaotic Neutral</p>
                        <p>CholMel</p>
                    </div>
                </div>
            </aside>
        </main>

        <!-- Footer -->
        <footer class="site-footer">
            <p>© slivko 2026</p>
        </footer>
    </div>

    <script src="main.js"></script>
</body>
</html>
